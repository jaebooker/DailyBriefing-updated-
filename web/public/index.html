<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Daily Briefing</title>
  <meta name="description" content="World news, AI, and cybersecurity in one morning read." />
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span id="today" class="dateline"></span>
      <div class="actions">
        <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <h1 class="title">Your Daily Briefing</h1>
    <p class="tagline">The world, artificial intelligence, and cybersecurity. One read.</p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="briefing">Briefing</button>
      <button role="tab" data-view="top">Top News</button>
      <button role="tab" data-view="ai">AI</button>
      <button role="tab" data-view="cyber">Cybersecurity</button>
      <button role="tab" data-view="saved">Saved <span id="saved-count" class="badge"></span></button>
    </nav>
  </header>

  <section class="toolbar" id="toolbar" hidden>
    <input id="search" type="search" placeholder="Search headlines" aria-label="Search headlines" />
    <div id="chips" class="chips"></div>
  </section>

  <main id="content" aria-live="polite">
    <div class="loading"><span></span><span></span><span></span></div>
  </main>

  <footer class="footer">
    <p id="status"></p>
    <details>
      <summary>Sources</summary>
      <ul id="source-list"></ul>
    </details>
  </footer>

  <template id="tpl-story">
    <article class="story">
      <a class="story-link" target="_blank" rel="noopener noreferrer">
        <div class="thumb"><img loading="lazy" alt="" referrerpolicy="no-referrer" /></div>
        <div class="body">
          <p class="meta"><span class="src"></span><span class="dot">·</span><time></time></p>
          <h3 class="headline"></h3>
          <p class="summary"></p>
        </div>
      </a>
      <button class="save" aria-label="Save for later" title="Save for later">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      </button>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
